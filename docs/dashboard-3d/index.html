<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seizure Watch 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050912;color:#dbe6ff;font:13px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.p{position:fixed;background:rgba(10,18,36,.72);border:1px solid #223458;border-radius:12px;backdrop-filter:blur(8px);padding:10px 12px}
#top{top:10px;left:10px;right:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:17px;letter-spacing:.3px}h1 small{display:block;font-size:11px;font-weight:400;color:#8ea0b8}
#kpis{display:flex;gap:8px;flex:1;overflow-x:auto}.k{min-width:96px;padding:2px 10px;border-left:2px solid #4f8cff}.k:nth-child(2){border-color:#ff4d5e}.k:nth-child(3){border-color:#ff9f43}.k:nth-child(4){border-color:#2ec4b6}.k:nth-child(5){border-color:#b983ff}.k:nth-child(6){border-color:#f5c542}
.k span{display:block;color:#8ea0b8;font-size:10px;text-transform:uppercase}.k b{font-size:20px}.k i{display:block;font-style:normal;color:#6f82a3;font-size:10px}
.tabs{display:flex;gap:4px}.tab,.chip,.lg,#spin{background:#12203f;color:#dbe6ff;border:1px solid #2a3c66;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.tab.on,.lg.on,#spin.on{background:#2f5fd0;border-color:#6d9bff}
#left{left:10px;top:88px;width:210px;max-height:calc(100% - 180px);overflow:auto}
#right{right:10px;top:88px;width:290px;max-height:calc(100% - 180px);overflow:auto}
h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;color:#8ea0b8;letter-spacing:.6px}
.lg{display:flex;align-items:center;gap:7px;width:100%;margin-bottom:4px;text-align:left}.lg i{width:10px;height:10px;border-radius:3px}.lg small{margin-left:auto;color:#9fb4d9}
#left label{display:block;margin-top:10px;color:#8ea0b8}#min{width:100%}
#bot{left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px}
.chip{padding:4px 9px;border-color:#4f8cff}.chip.clear{border-color:#ff4d5e}.hint{color:#8ea0b8}
#events a{display:flex;gap:8px;padding:6px 0;border-top:1px solid #1c2c4d;color:inherit;text-decoration:none}#events a:hover{background:#12203f}
#events b{background:#ff4d5e;color:#fff;border-radius:6px;padding:1px 6px;height:18px;font-size:11px}#events small{display:block;color:#8ea0b8}
#tip{position:fixed;left:0;top:0;pointer-events:none;opacity:0;background:#0b1530ee;border:1px solid #3a5aa0;border-radius:8px;padding:7px 10px;max-width:260px;z-index:5}#tip b{display:block;margin-bottom:2px}
#load{position:fixed;inset:0;display:grid;place-items:center;font-size:16px;color:#8ea0b8;z-index:9;background:#050912}
body.dashv #left,body.dashv #right,body.dashv #kpis{display:none}body.dashv #top{width:auto;right:auto}body.dashv #bot{right:auto}
.tab.on,.lg.on,#spin.on{background:#e08a1e;border-color:#ffb85c;color:#1a1000}
@media(max-width:820px){#right{display:none}#left{width:170px;top:auto;bottom:70px;max-height:34%}#top{top:6px}.k{min-width:80px}.k b{font-size:16px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="load">Loading Seizure Watch…</div>
<div class="p" id="top">
 <h1>Seizure Watch 3D<small>Open-source seizure risk indicators · <span id="dates"></span> · unverified news</small></h1>
 <div id="kpis"></div>
 <div class="tabs"><button class="tab on" data-v="dash">Dashboard</button><button class="tab" data-v="globe">Globe</button><button class="tab" data-v="time">Timeline</button><button class="tab" data-v="rank">Rankings</button><button id="spin" class="on">Spin</button></div>
</div>
<div class="p" id="left"><h3>Drug group</h3><div id="legend"></div><h3 style="margin-top:10px">Risk band</h3><div id="bands"></div>
 <label>Minimum risk score <b id="minv">10</b><input id="min" type="range" min="10" max="100" step="5" value="10"></label></div>
<div class="p" id="right"><h3>Highest-scoring events in view</h3><div id="events"></div></div>
<div class="p" id="bot"><span id="chips"></span></div>
<div id="tip"></div>
<script src="app.js"></script>
</body></html>
