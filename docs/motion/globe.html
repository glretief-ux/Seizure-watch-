<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seizure Watch Motion 3D</title>
<style>
:root { color-scheme: dark; --bg:#070e18; --panel:rgba(14,26,41,.78); --edge:#1f3047; --ink:#e8eef5; --muted:#8ea0b5; --now:#ff8a3d; --teal:#3fc1b0; --blue:#5b9bf0;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif; --body:"Barlow","Segoe UI",-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px var(--body); overflow:hidden; }
#stage { position:fixed; inset:0; touch-action:none; cursor:grab; }
#stage:active { cursor:grabbing; }
#hud { position:fixed; inset:0; pointer-events:none; display:grid; grid-template-columns:minmax(260px,330px) 1fr minmax(260px,330px); grid-template-rows:auto 1fr auto; gap:12px;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); }
#hud > * { pointer-events:auto; }
header { grid-column:1 / 4; display:flex; justify-content:space-between; align-items:end; gap:12px; pointer-events:none; }
.kicker { font:600 .78rem var(--body); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
h1 { margin:2px 0 0; font:700 clamp(1.7rem,3.6vw,2.8rem)/1 var(--display); text-wrap:balance; }
.clock { text-align:right; } .clock .d { font:700 clamp(1.9rem,4vw,3.2rem)/1 var(--display); color:var(--now); font-variant-numeric:tabular-nums; }
.clock .n { font-size:.78rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
.col { display:grid; gap:10px; align-content:start; }
.col.right { grid-column:3; grid-row:2; } .col.left { grid-column:1; grid-row:2; }
.tile { background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--edge); border-radius:10px; padding:11px 14px; display:grid; gap:6px; min-width:0; }
.tile h2 { margin:0; font:600 .74rem var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.kpi .v { font:700 clamp(1.8rem,3vw,2.6rem)/1 var(--display); font-variant-numeric:tabular-nums; }
.kpi .s { color:var(--muted); font-size:.74rem; line-height:1.25; }
.rows { position:relative; } .row { position:absolute; left:0; right:0; height:28px; display:grid; grid-template-columns:minmax(70px,34%) 1fr; align-items:center; gap:8px; transition:transform .55s cubic-bezier(.3,.7,.2,1), opacity .3s; }
.row .l { font-size:.84rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
.row .t { position:relative; height:16px; } .row .b { position:absolute; left:0; top:0; height:100%; border-radius:0 3px 3px 0; background:var(--blue); min-width:2px; transition:width .3s; }
.row .n { position:absolute; top:0; font:600 .92rem/16px var(--display); padding-left:6px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.race.c .b { background:var(--teal); }
.col-box { height:64px; display:flex; align-items:end; gap:2px; border-bottom:1px solid var(--edge); }
.col-box i { flex:1 1 0; min-width:0; background:#2a4668; border-radius:2px 2px 0 0; height:0; } .col-box i.on { background:var(--blue); } .col-box i.now { background:var(--now); }
.axis { display:flex; justify-content:space-between; color:var(--muted); font-size:.72rem; }
.legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:.76rem; } .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
.bar { grid-column:1 / 4; grid-row:3; display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--edge); border-radius:10px; padding:8px 12px; }
.bar button { font:600 .88rem var(--body); color:var(--ink); background:#1b2e45; border:1px solid #2c4666; border-radius:8px; padding:7px 13px; cursor:pointer; min-height:40px; }
.bar button:hover { background:#22395a; } .bar button[aria-pressed=true] { border-color:var(--now); }
.bar #play { background:var(--now); color:#1a0f06; border-color:var(--now); min-width:88px; }
.bar input[type=range] { flex:1 1 180px; min-width:0; accent-color:var(--now); height:28px; }
.bar .back { color:var(--muted); font-size:.85rem; padding:0 6px; text-decoration:none; } .bar .back:hover { color:var(--ink); }
button:focus-visible, input:focus-visible { outline:2px solid var(--now); outline-offset:2px; }
.note { position:fixed; right:max(14px,env(safe-area-inset-right)); bottom:84px; max-width:42ch; color:var(--muted); font-size:.7rem; line-height:1.4; text-align:right; pointer-events:none; text-shadow:0 1px 4px #000; }
@media (max-width:980px) {
  #hud { grid-template-columns:1fr 1fr; grid-template-rows:auto auto 1fr auto; }
  header { grid-column:1 / 3; } .col.left { grid-column:1 / 3; grid-row:2; } .col.right { grid-column:1 / 3; grid-row:4; display:none; }
  .col.left .race, .col.left .daily { display:none; } .bar { grid-column:1 / 3; grid-row:4; } .note { display:none; }
  .clock { text-align:right; }
}
@media (max-width:980px) and (min-height:1000px) { .col.left .daily { display:grid; } }
@media (max-width:980px) { .col.left .legend { display:none; } .bar button { padding:6px 10px; min-height:38px; } .bar input[type=range] { order:5; flex-basis:100%; } .kpi .s { display:none; } h1 { font-size:1.5rem; } }

</style>
</head>
<body>
<div id="stage" role="img" aria-label="Interactive 3D globe. Orange pulses mark each new seizure report as 30 days play back; blue dots mark earlier reports."></div>
<div id="hud">
  <header>
    <div><div class="kicker">Seizure Watch · open-source reports</div><h1>The last 30 days, in 3D</h1></div>
    <div class="clock"><div class="d" id="date">–</div><div class="n" id="dayn">Day 30 of 30</div></div>
  </header>
  <div class="col left">
    <div class="kpis tile">
      <div class="kpi"><h2>Reports</h2><div class="v" id="kR">0</div><div class="s">cumulative</div></div>
      <div class="kpi"><h2>Countries</h2><div class="v" id="kC">0</div><div class="s">reporting</div></div>
      <div class="kpi"><h2>Tonnes</h2><div class="v" id="kT">0</div><div class="s">where stated</div></div>
    </div>
    <div class="tile daily"><h2>Reports per day</h2><div class="col-box" id="cols"></div><div class="axis"><span id="ax0"></span><span id="ax1"></span></div></div>
    <div class="tile legend"><span><i style="background:var(--now)"></i>new report</span><span><i style="background:var(--blue)"></i>earlier in the period</span><span id="noLoc"></span></div>
  </div>
  <div class="col right">
    <div class="tile race"><h2>What is being seized</h2><div class="rows" id="rowsI"></div></div>
    <div class="tile race c"><h2>Where it is reported</h2><div class="rows" id="rowsC"></div></div>
  </div>
  <div class="bar">
    <button id="play" type="button" aria-label="Play or pause">Pause</button>
    <button id="replay" type="button">Replay</button>
    <input id="scrub" type="range" min="0" max="3000" value="3000" aria-label="Day">
    <button id="speed" type="button" aria-label="Playback speed">1×</button>
    <button id="spin" type="button" aria-pressed="true">Auto-rotate</button>
    <a class="back" href="index.html">2D view</a>
  </div>
</div>
<p class="note" id="note"></p>
