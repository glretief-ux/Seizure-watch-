name: daily-seizure-watch

on:
  schedule:
    # hourly (at 17 minutes past), so a new report shows up within about an hour
    - cron: "17 * * * *"
  workflow_dispatch:               # lets you press "Run workflow" by hand
    inputs:
      days:
        description: "Look-back days (use 30 for the very first run to back-fill history)"
        default: "2"
      send_bulletin:
        description: "Also e-mail the weekly bulletin now (only works once the e-mail secrets are added)"
        type: boolean
        default: false

permissions:
  contents: write                  # so the job can save the updated database and dashboard

concurrency:
  group: seizure-watch
  cancel-in-progress: false        # never run two at the same time

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - name: Collect, analyse, build the dashboard and bulletin
        run: python run_daily.py --days "${{ github.event.inputs.days || '2' }}" ${{ github.event.inputs.send_bulletin == 'true' && '--send-bulletin' || '' }}
        env:
          # optional: only needed to e-mail the weekly bulletin (add them under Settings > Secrets and variables > Actions)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BULLETIN_TO: ${{ secrets.BULLETIN_TO }}
          BULLETIN_FROM: ${{ secrets.BULLETIN_FROM }}
      - name: Save results
        run: |
          git config user.name  "seizure-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seizure_watch.db docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push || (git pull --rebase -X theirs origin main && git push)
