name: weekly-newsletter
# design v2.1: colourful layout

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC = 08:00/09:00 Brussels, ready before 10:00
  workflow_dispatch:
    inputs:
      end_date:
        description: "Last day of the 7-day week (YYYY-MM-DD); empty = latest day in the data"
        default: ""
  push:
    paths:
      - .github/workflows/newsletter.yaml
      - scripts/build_newsletter.py

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install weasyprint
      - name: Build newsletter (HTML + PDF, photos embedded)
        run: |
          END="${{ github.event.inputs.end_date }}"
          # scheduled runs (and pushes): always the previous full Monday-Sunday week
          if [ -z "$END" ]; then END=$(TZ=Europe/Brussels date -d "last sunday" +%F); fi
          python scripts/build_newsletter.py "$END"
      - name: Save
        run: |
          git config user.name  "seizure-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/newsletter.html docs/newsletter.pdf
          git diff --cached --quiet || git commit -m "Newsletter $(date -u +%F)"
          git push || (git pull --rebase --autostash -X theirs origin main && git push)
