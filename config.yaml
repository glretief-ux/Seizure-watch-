  # Extra RSS feeds. Each shows up in the run log as "RSS <name>: N items"; N = 0 means the address is wrong or blocked.
  rss_feeds:
    - {name: "Hong Kong government press releases (includes Customs)", url: "https://www.info.gov.hk/gia/rss/general_en.xml", lang: en, country: "Hong Kong"}
    # Not checked yet - the log will tell you whether they work:
    - {name: "UK National Crime Agency", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=national-crime-agency", lang: en, country: "United Kingdom"}
    - {name: "UK Border Force", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=border-force", lang: en, country: "United Kingdom"}
    - {name: "NDLEA Nigeria", url: "https://ndlea.gov.ng/feed/", lang: en, country: "Nigeria"}

# ---------------------------------------------------------------------
#  WEEKLY BULLETIN  (one page: new corridors, unusual events, how drugs were hidden)
# ---------------------------------------------------------------------
bulletin:
  enabled: true
  weekday: 0                    # 0 = Monday: the first run of that day e-mails it (if e-mail is set up)
  dashboard_url: "https://glretief-ux.github.io/Seizure-watch-/"
  # The page is always published as bulletin.html. To also e-mail it, add these GitHub secrets
  # (Settings > Secrets and variables > Actions): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, BULLETIN_TO
  # (comma-separated recipients) and optionally BULLETIN_FROM. They are kept out of this public repository.

# ---------------------------------------------------------------------
#  RISK MODEL  (event score 0-100; all numbers are yours to tune)
# ---------------------------------------------------------------------
risk:
  # The score is built from FIVE dimensions with their own caps, so no single factor (and
  # in particular seizure weight) can decide the result. Max total = 100.
  points:
    method:                          # max 30 - how it was smuggled
      advanced_concealment: 15       # false compartments, impregnation, hull attachments...
      concealed_in_legit_cargo: 10   # hidden inside food, goods or a cover load
      container_cargo: 5             # seized from / travelling in a shipping container
      false_declaration: 8           # declared as other goods, forged papers, or no permit/licence (cargo risk list s.3-4)
    network:                         # max 30 - who was behind it
      insider_indicator: 15          # port / airport / customs staff involvement, rip-on/rip-off
      organized_network: 10          # article mentions cartel / organised crime network
      polydrug: 5                    # more than one drug type in the same consignment
      front_company: 8               # shell / front / newly registered / first-time company named (list s.1)
      repeat_entity: 10              # same vessel or container already in another seizure (list s.8)
      intel_tip: 5                   # intelligence-led, tip-off, partner-agency alert or risk-profiling hit (list s.8)
    route:                           # max 20 - where it moved
      multi_country_route: 15        # 3+ countries in the route, or a named transit country
      emerging_corridor: 5           # origin->destination pair not seen before in the recent past
      transshipment: 5               # transhipment, re-export, free zone or bonded warehouse named (list s.2)
      route_change: 5                # diversion, change of port / vessel / route after departure (list s.2)
    scale:                           # max 10 - deliberately small: weight alone must never decide
      quantity_outlier: 10           # very large for its type (thresholds below)
    commodity:                       # max 10 - how harmful the goods are (tiers below)
      1: 10
      2: 5
      3: 0
  caps:                              # each dimension is clipped here, however many indicators fire
    method: 30
    network: 30
    route: 20
  # WATCHLIST: a hit forces the event to High whatever its score (list s.8: "treat as High regardless").
  # This repository is public, so only put names here that you are happy to publish.
  watchlist:
    vessels: []                      # e.g. ["MV EXAMPLE"]
    containers: []                   # e.g. ["MSKU1234567"]
    terms: []                        # words or phrases searched in the headline and cover cargo
  commodity_tiers:
    default: 2                       # anything not listed below
    categories: {Tobacco: 3, Precursor chemical: 2, Hazardous chemical: 2, Cultural heritage: 2, Stolen vehicle: 2, CITES protected timber: 2}
    items:                           # tier 1 = highest harm, tier 3 = lowest
      1: [Cocaine, Heroin/Opium, Methamphetamine, NSA, Explosives/grenades, Explosive precursors, Firearms, Elephant ivory, Rhino horn, Pangolin, Big cat parts]
      3: [Cigarettes]
  # An event is only High if it scores >= high AND at least this many of method / network / route
  # show something (Medium: at least 1). Scale and commodity alone can never lift an event.
  min_dimensions_high: 2
  min_dimensions_medium: 1
  bands: {high: 50, medium: 25}    # score >= high -> High ; >= medium -> Medium ; else Low
  quantity_thresholds_kg:          # weight above which a seizure counts as "large"
    Cocaine: 500
    Cannabis: 2000
    Heroin/Opium: 100
    Methamphetamine: 100
    NSA: 100
    Cigarettes: 5000
    # Precursor chemicals (kg) - thresholds reflect how much of each is needed
    # to matter for a lab, not drug-equivalent weight
    Acetic anhydride: 2000
    Ephedrine/Pseudoephedrine: 50
    P2P/BMK/PMK: 50
    Potassium permanganate: 1000
    Sodium cyanide: 500
    Red phosphorus: 200
    Acetone/solvents: 2000
    # Hazardous chemicals (kg) - judgement values, edit freely
    Ozone-depleting refrigerants: 1000
    Pesticides/agrochemicals: 5000
    Mercury: 100
    Explosive precursors: 500
    Hazardous/toxic waste: 20000
    Industrial/toxic chemicals: 5000
    # CITES-protected timber (kg)
    Rosewood (Dalbergia): 5000
    Mukula: 5000
    Ebony: 2000
    Agarwood: 50
    Ramin: 5000
    Afrormosia: 5000
    Mahogany: 5000
    Kosso (Pterocarpus erinaceus): 5000
    Red sandalwood (Pterocarpus santalinus): 1000
    Spanish cedar (Cedrela): 5000
    Afzelia (doussie): 5000
    Lignum vitae (Guaiacum): 2000
    # CITES elephant ivory and other protected fauna (kg). Ivory: 500 kg is the
    # usual "large-scale seizure" cut-off; the rest are judgement values - edit freely.
    Elephant ivory: 500
    Rhino horn: 5
    Pangolin: 100
    Big cat parts: 5
    Sharks, rays and marine species: 500
    Glass eels: 50
    Bear parts: 20
    Bushmeat: 500
    # Explosives/grenades (kg) - weight-based reports (e.g. TNT, dynamite)
    Explosives/grenades: 50
    default: 200
  unit_thresholds:                 # for pills / sticks when no weight is given
    pills: 500000
    cigarettes: 2000000
    packs: 100000
    vehicles: 10                   # 10+ stolen vehicles in one report is a large outlier
    tusks: 10                      # CITES ivory counted in tusks
    horns: 5                       # rhino horns
    skins: 20                      # big-cat or reptile skins
    animals: 100                   # live or dead protected animals in one report
    pieces: 100                    # worked ivory / wildlife pieces
    firearms: 20                   # 20+ firearms in one report is a large outlier
    rounds: 10000                  # 10,000+ rounds of ammunition in one report is a large outlier
  percentile_min_events: 30        # once a drug has this many events, also flag its own top 5%

analysis:
  trend_window_days: 30            # "recent" vs "prior" window for corridor / hotspot trends
  min_history_days: 42             # below this, NEW-corridor and spike alerts stay quiet (not enough history)
  emerging_days: 60                # a corridor first seen within this many days counts as emerging
  spike_min_events: 3              # minimum events in the last 7 days to raise a spike alert
  spike_z: 2.0                     # how far above the 8-week average counts as a spike

# ---------------------------------------------------------------------
#  LINKS BETWEEN SEPARATE SEIZURES (repeat vessels / containers / cargo, precursor-to-drug chain)
# ---------------------------------------------------------------------
links:
  recent_days: 30                 # a repeat link is only shown while one of its seizures is this recent
  min_events:                     # separate seizures needed before a repeat is shown
    Vessel: 2
    Container number: 2
    Shipping line: 4              # big carriers are in many seizures by chance: shown in the table, never alerted
    Loading place: 4
    Cover cargo on corridor: 3
  chain_days: 90                  # look back this far for precursor seizures and clandestine labs
  chain_gap_days: 60              # a synthetic-drug seizure in the same country this close in time counts as linked
