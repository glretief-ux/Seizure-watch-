# =====================================================================
#  SEIZURE WATCH - configuration
#  Everything you may want to tune is here. Comments explain each block.
# =====================================================================

run:
  lookback_days: 2            # how far back each daily run searches (2 = safe overlap)
  max_articles_per_run: 1500   # cap on article downloads per run (official sources are read first)
  fetch_full_text: true       # false = headline/snippet only (faster, less accurate)
  resolve_google_links: true  # needs the optional 'googlenewsdecoder' package (in requirements.txt)
  report_days: 180            # how much history the dashboard shows

sources:
  google_news:
    enabled: true
    delay_seconds: 1.0
    # Each edition = one Google News country/language front page. More editions = wider coverage.
    editions:
      - {lang: en, hl: en-US,  gl: US, ceid: "US:en"}
      - {lang: en, hl: en-GB,  gl: GB, ceid: "GB:en"}
      - {lang: en, hl: en-AU,  gl: AU, ceid: "AU:en"}
      - {lang: en, hl: en-IN,  gl: IN, ceid: "IN:en"}
      - {lang: en, hl: en-ZA,  gl: ZA, ceid: "ZA:en"}
      - {lang: en, hl: en-NG,  gl: NG, ceid: "NG:en"}
      - {lang: es, hl: es-419, gl: MX, ceid: "MX:es-419"}
      - {lang: es, hl: es,     gl: ES, ceid: "ES:es"}
      - {lang: es, hl: es-419, gl: CO, ceid: "CO:es-419"}
      - {lang: fr, hl: fr,     gl: FR, ceid: "FR:fr"}
      - {lang: pt, hl: pt-BR,  gl: BR, ceid: "BR:pt-419"}
      - {lang: pt, hl: pt-PT,  gl: PT, ceid: "PT:pt-150"}
      # more languages (Arabic, Turkish, Russian, Chinese, Hindi)
      - {lang: ar, hl: ar,     gl: SA, ceid: "SA:ar"}
      - {lang: ar, hl: ar,     gl: EG, ceid: "EG:ar"}
      - {lang: ar, hl: ar,     gl: AE, ceid: "AE:ar"}
      - {lang: tr, hl: tr,     gl: TR, ceid: "TR:tr"}
      - {lang: ru, hl: ru,     gl: RU, ceid: "RU:ru"}
      - {lang: ru, hl: ru,     gl: UA, ceid: "UA:ru"}
      - {lang: zh, hl: zh-CN,  gl: CN, ceid: "CN:zh-Hans"}
      - {lang: zh, hl: zh-HK,  gl: HK, ceid: "HK:zh-Hant"}
      - {lang: zh, hl: zh-TW,  gl: TW, ceid: "TW:zh-Hant"}
      - {lang: hi, hl: hi,     gl: IN, ceid: "IN:hi"}
      - {lang: vi, hl: vi,     gl: VN, ceid: "VN:vi"}   # Vietnam (ivory searches)
    queries:
      en: ["drug seizure", "cocaine seized", "heroin seized", "methamphetamine seized",
           "cannabis seized customs", "captagon seized", "fentanyl seized", "MDMA ecstasy seized",
           "cigarettes seized customs", "drugs seized container port", "drugs seized airport",
           "precursor chemicals seized", "clandestine drug lab chemicals seized",
           "hazardous chemicals seized customs", "toxic chemicals smuggling seized",
           "ozone-depleting refrigerant gas smuggling seized", "HFC refrigerants seized customs",
           "illegal pesticides seized", "counterfeit pesticides seized", "mercury smuggling seized",
           "ammonium nitrate seized", "hazardous waste shipment seized",
           "stolen vehicles recovered smuggling", "stolen cars seized border",
           "illegal logging timber seized", "CITES protected timber seized", "rosewood seized trafficking",
           "elephant ivory seized", "ivory tusks seized customs", "rhino horn seized", "pangolin scales seized",
           "wildlife trafficking seized", "CITES protected species seized", "live reptiles smuggling seized",
           "protected birds smuggling seized", "shark fins seized", "glass eels trafficking seized",
           "tiger skin bones seized", "exotic animals smuggling airport",
           "illegal firearms seized", "weapons cache seized", "ammunition seized smuggling",
           "arms trafficking seized"]
      es: ["incautan cocaína", "decomisan droga puerto contenedor", "incautan marihuana",
           "incautan metanfetamina", "incautan drogas sintéticas aeropuerto",
           "incautan químicos precursores", "incautan productos químicos", "decomisan plaguicidas ilegales",
           "incautan mercurio", "decomisan gas refrigerante contrabando", "decomisan vehículos robados", "madera ilegal incautada",
           "incautan marfil", "tráfico de fauna silvestre incautan", "decomisan animales exóticos aeropuerto",
            "incautan armas de fuego", "decomisan municiones", "incautan arsenal"]
      fr: ["saisie cocaïne", "saisie drogue port conteneur", "saisie cannabis douane", "saisie captagon",
           "saisie précurseurs chimiques", "saisie produits chimiques dangereux", "saisie pesticides illégaux",
           "saisie gaz réfrigérants", "véhicules volés saisis", "bois illégal saisi",
           "saisie ivoire", "trafic faune sauvage saisie", "saisie civelles",
            "saisie armes a feu", "saisie munitions", "trafic d'armes saisi"]
      pt: ["apreensão cocaína porto", "apreensão droga contêiner", "apreendem maconha",
           "apreensão de químicos precursores", "apreensão de produtos químicos", "apreensão de agrotóxicos ilegais",
           "apreensão de mercúrio", "veículos roubados apreendidos", "madeira ilegal apreendida",
           "apreensão marfim", "tráfico de animais silvestres apreensão",
            "apreensão de armas de fogo", "apreendem munições"]
      ar: ["ضبط مخدرات", "ضبط كوكايين", "ضبط حشيش", "ضبط كبتاجون", "إحباط تهريب مخدرات", "ضبط هيروين", "ضبط ترامادول"]
      tr: ["uyuşturucu ele geçirildi", "kokain ele geçirildi", "esrar ele geçirildi", "uyuşturucu hap ele geçirildi", "liman konteyner kokain", "captagon ele geçirildi"]
      ru: ["изъяли наркотики", "изъяли кокаин", "изъяли героин", "изъяли метамфетамин", "контрабанда наркотиков порт", "изъяли синтетические наркотики"]
      zh: ["缴获毒品", "查获可卡因", "海关 查获 毒品", "檢獲 毒品", "檢獲 可卡因", "緝獲 冰毒"]
      vi: ["thu giữ ngà voi", "bắt giữ buôn lậu ngà voi", "hải quan phát hiện ngà voi", "ngà voi nhập lậu"]
      hi: ["ड्रग्स जब्त", "कोकीन जब्त", "गांजा बरामद", "हेरोइन बरामद", "अफीम जब्त", "नशीली गोलियां बरामद"]

  gdelt:                       # global news index; free, no key. Set enabled: false to skip.
    enabled: true
    queries:
      en: ['(cocaine OR heroin OR methamphetamine OR cannabis OR captagon OR fentanyl) (seized OR seizure OR intercepted)',
           '(precursor chemicals OR clandestine lab) (seized OR seizure)',
           '("hazardous chemicals" OR "toxic chemicals" OR "illegal pesticides" OR refrigerants OR "ozone-depleting" OR "ammonium nitrate" OR "hazardous waste") (seized OR seizure OR smuggling)',
           '(mercury) (smuggling OR seized) (mining OR customs)',
           '(stolen vehicles OR stolen cars) (seized OR recovered OR smuggling)',
           '(illegal logging OR protected timber OR rosewood) (seized OR seizure)',
           '(ivory OR "rhino horn" OR pangolin OR "wildlife trafficking") (seized OR seizure OR smuggling)',
           '("CITES" OR "protected species" OR "shark fins" OR "glass eels") (seized OR seizure)',
           '(illegal firearms OR weapons cache OR ammunition OR arms trafficking) (seized OR seizure)']
      es: ['(cocaína OR heroína OR metanfetamina OR marihuana) (incautan OR decomisan OR incautación)',
           '(químicos precursores OR laboratorio clandestino) (incautan OR decomisan)',
           '(productos químicos OR plaguicidas OR mercurio OR refrigerantes) (incautan OR decomisan)',
           '(vehículos robados) (decomisan OR recuperan)',
           '(armas de fuego OR municiones OR arsenal) (incautan OR decomisan)']
      fr: ['(cocaïne OR héroïne OR cannabis OR captagon) (saisie OR saisi OR saisis)',
           '(précurseurs chimiques) (saisie OR saisis)',
           '(véhicules volés) (saisie OR récupérés)',
           '(armes a feu OR munitions) (saisie OR saisis)']
      pt: ['(cocaína OR heroína OR maconha) (apreensão OR apreendem OR apreendida)',
           '(químicos precursores) (apreensão OR apreendem)',
           '(veículos roubados) (apreensão OR recuperados)',
           '(armas de fogo OR munições) (apreensão OR apreendem)']
      ar: ['(كوكايين OR هيروين OR حشيش OR كبتاجون) (ضبط OR إحباط)']
      tr: ['(kokain OR eroin OR esrar OR uyuşturucu) ("ele geçirildi" OR yakalandı)']
      ru: ['(кокаин OR героин OR метамфетамин OR наркотики) (изъяли OR изъято OR задержали)']
      zh: ['(可卡因 OR 海洛因 OR 冰毒 OR 毒品) (缴获 OR 查获 OR 檢獲)']
      hi: ['(कोकीन OR हेरोइन OR गांजा OR ड्रग्स) (जब्त OR बरामद)']
      vi: ['("ngà voi") (thu giữ OR bắt giữ OR buôn lậu)']

  # Official newsrooms. Google News is searched once per website below (site:...), so official press
  # releases are picked up even when no newspaper reports them. Add or remove websites freely.
  official_sites:
    enabled: true
    query: "site:{site} (seized OR seizure OR seizes OR intercepted OR incautan OR decomisan OR saisie OR apreensao) (cocaine OR heroin OR methamphetamine OR cannabis OR fentanyl OR captagon OR drugs OR cocaina OR droga OR cocaine OR drogue OR \"precursor chemicals\" OR \"hazardous chemicals\" OR \"toxic chemicals\" OR pesticides OR refrigerants OR mercury OR \"ammonium nitrate\" OR \"hazardous waste\" OR \"stolen vehicles\" OR \"illegal logging\" OR \"protected timber\" OR rosewood OR \"illegal firearms\" OR \"weapons cache\" OR ammunition OR \"arms trafficking\" OR ivory OR \"rhino horn\" OR pangolin OR \"wildlife trafficking\" OR CITES)"
    sites:
      - cbp.gov               # US Customs and Border Protection
      - dea.gov               # US Drug Enforcement Administration
      - justice.gov           # US Department of Justice / US attorneys
      - ice.gov               # US Homeland Security Investigations
      - uscg.mil              # US Coast Guard
      - gov.uk                # UK National Crime Agency, Border Force, HMRC
      - afp.gov.au            # Australian Federal Police
      - abf.gov.au            # Australian Border Force
      - europol.europa.eu     # Europol
      - unodc.org             # UN Office on Drugs and Crime
      - wcoomd.org            # World Customs Organization
      - interpol.int          # Interpol
      - sars.gov.za           # South African Revenue Service (customs)
      - saps.gov.za           # South African Police Service
      - ndlea.gov.ng          # Nigeria drug law enforcement agency
      - nacoc.gov.gh          # Ghana Narcotics Control Commission
      - pib.gov.in            # India government press releases (customs, DRI, NCB)
      - pdea.gov.ph           # Philippine Drug Enforcement Agency
      - cnb.gov.sg            # Singapore Central Narcotics Bureau
      - douane.gouv.fr        # French customs
      - zoll.de               # German customs
      - guardiacivil.es       # Spanish Guardia Civil
      - agenciatributaria.es  # Spanish tax and customs agency
      - policia.gov.co        # Colombian national police
      - aduana.gob.ec         # Ecuador customs
      - gob.pe                # Peru government (police, customs)
      - gob.mx                # Mexican government (navy, army, customs)
      - gov.br                # Brazil government (federal police, Receita Federal)

  # Extra RSS feeds. Each shows up in the run log as "RSS <name>: N items"; N = 0 means the address is wrong or blocked.
  rss_feeds:
    - {name: "Hong Kong government press releases (includes Customs)", url: "https://www.info.gov.hk/gia/rss/general_en.xml", lang: en, country: "Hong Kong"}
    # Not checked yet - the log will tell you whether they work:
    - {name: "UK National Crime Agency", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=national-crime-agency", lang: en, country: "United Kingdom"}
    - {name: "UK Border Force", url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=border-force", lang: en, country: "United Kingdom"}
    - {name: "NDLEA Nigeria", url: "https://ndlea.gov.ng/feed/", lang: en, country: "Nigeria"}

# ---------------------------------------------------------------------
#  WEEKLY BULLETIN  (one page: new corridors, unusual events, how drugs were hidden)
# ---------------------------------------------------------------------
bulletin:
  enabled: true
  weekday: 0                    # 0 = Monday: the first run of that day e-mails it (if e-mail is set up)
  dashboard_url: "https://glretief-ux.github.io/Seizure-watch-/"
  # The page is always published as bulletin.html. To also e-mail it, add these GitHub secrets
  # (Settings > Secrets and variables > Actions): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, BULLETIN_TO
  # (comma-separated recipients) and optionally BULLETIN_FROM. They are kept out of this public repository.

# ---------------------------------------------------------------------
#  RISK MODEL  (event score 0-100; all numbers are yours to tune)
# ---------------------------------------------------------------------
risk:
  # The score is built from FIVE dimensions with their own caps, so no single factor (and
  # in particular seizure weight) can decide the result. Max total = 100.
  points:
    method:                          # max 30 - how it was smuggled
      advanced_concealment: 15       # false compartments, impregnation, hull attachments...
      concealed_in_legit_cargo: 10   # hidden inside food, goods or a cover load
      container_cargo: 5             # seized from / travelling in a shipping container
    network:                         # max 30 - who was behind it
      insider_indicator: 15          # port / airport / customs staff involvement, rip-on/rip-off
      organized_network: 10          # article mentions cartel / organised crime network
      polydrug: 5                    # more than one drug type in the same consignment
    route:                           # max 20 - where it moved
      multi_country_route: 15        # 3+ countries in the route, or a named transit country
      emerging_corridor: 5           # origin->destination pair not seen before in the recent past
    scale:                           # max 10 - deliberately small: weight alone must never decide
      quantity_outlier: 10           # very large for its type (thresholds below)
    commodity:                       # max 10 - how harmful the goods are (tiers below)
      1: 10
      2: 5
      3: 0
  commodity_tiers:
    default: 2                       # anything not listed below
    categories: {Precursor chemical: 2, Hazardous chemical: 2, Stolen vehicle: 2, CITES protected timber: 2}
    items:                           # tier 1 = highest harm, tier 3 = lowest
      1: [Cocaine, Heroin/Opium, Methamphetamine, NSA, Explosives/grenades, Explosive precursors, Firearms, Elephant ivory, Rhino horn, Pangolin, Big cat parts]
      3: [Cigarettes]
  # An event is only High if it scores >= high AND at least this many of method / network / route
  # show something (Medium: at least 1). Scale and commodity alone can never lift an event.
  min_dimensions_high: 2
  min_dimensions_medium: 1
  bands: {high: 50, medium: 25}    # score >= high -> High ; >= medium -> Medium ; else Low
  quantity_thresholds_kg:          # weight above which a seizure counts as "large"
    Cocaine: 500
    Cannabis: 2000
    Heroin/Opium: 100
    Methamphetamine: 100
    NSA: 100
    Cigarettes: 5000
    # Precursor chemicals (kg) - thresholds reflect how much of each is needed
    # to matter for a lab, not drug-equivalent weight
    Acetic anhydride: 2000
    Ephedrine/Pseudoephedrine: 50
    P2P/BMK/PMK: 50
    Potassium permanganate: 1000
    Sodium cyanide: 500
    Red phosphorus: 200
    Acetone/solvents: 2000
    # Hazardous chemicals (kg) - judgement values, edit freely
    Ozone-depleting refrigerants: 1000
    Pesticides/agrochemicals: 5000
    Mercury: 100
    Explosive precursors: 500
    Hazardous/toxic waste: 20000
    Industrial/toxic chemicals: 5000
    # CITES-protected timber (kg)
    Rosewood (Dalbergia): 5000
    Mukula: 5000
    Ebony: 2000
    Agarwood: 50
    Ramin: 5000
    Afrormosia: 5000
    Mahogany: 5000
    # CITES elephant ivory and other protected fauna (kg). Ivory: 500 kg is the
    # usual "large-scale seizure" cut-off; the rest are judgement values - edit freely.
    Elephant ivory: 500
    Rhino horn: 5
    Pangolin: 100
    Big cat parts: 5
    Sharks, rays and marine species: 500
    Glass eels: 50
    Bear parts: 20
    Bushmeat: 500
    # Explosives/grenades (kg) - weight-based reports (e.g. TNT, dynamite)
    Explosives/grenades: 50
    default: 200
  unit_thresholds:                 # for pills / sticks when no weight is given
    pills: 500000
    cigarettes: 2000000
    packs: 100000
    vehicles: 10                   # 10+ stolen vehicles in one report is a large outlier
    tusks: 10                      # CITES ivory counted in tusks
    horns: 5                       # rhino horns
    skins: 20                      # big-cat or reptile skins
    animals: 100                   # live or dead protected animals in one report
    pieces: 100                    # worked ivory / wildlife pieces
    firearms: 20                   # 20+ firearms in one report is a large outlier
    rounds: 10000                  # 10,000+ rounds of ammunition in one report is a large outlier
  percentile_min_events: 30        # once a drug has this many events, also flag its own top 5%

analysis:
  trend_window_days: 30            # "recent" vs "prior" window for corridor / hotspot trends
  min_history_days: 42             # below this, NEW-corridor and spike alerts stay quiet (not enough history)
  emerging_days: 60                # a corridor first seen within this many days counts as emerging
  spike_min_events: 3              # minimum events in the last 7 days to raise a spike alert
  spike_z: 2.0                     # how far above the 8-week average counts as a spike
