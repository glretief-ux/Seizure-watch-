      mn: ['(кокаин OR героин OR мансууруулах) (хураан OR илрүүллээ OR хураагдлаа)']
      "no": ['(kokain OR heroin OR hasj OR amfetamin OR narkotika) (beslag OR beslaglagt OR "tok i beslag")']
      sk: ['(kokaín OR heroín OR marihuana OR pervitín OR drogy) (zaistili OR zaistené OR zadržali)']
      sv: ['(kokain OR heroin OR hasch OR amfetamin OR narkotika) (beslag OR beslagtog OR beslagtagit)']

  # Official newsrooms. Google News is searched once per website below (site:...), so official press
  # releases are picked up even when no newspaper reports them. Add or remove websites freely.
  official_sites:
    enabled: true
    query: "site:{site} (seized OR seizure OR seizes OR intercepted OR incautan OR decomisan OR saisie OR apreensao OR \"in beslag genomen\" OR onderschept OR inbeslagname OR sichergestellt OR beschlagnahmt OR beslaglagt OR beslag OR zaistili OR konfiskeeriti OR haldlagt OR \"lagði hald\") (cocaine OR heroin OR methamphetamine OR cannabis OR fentanyl OR captagon OR drugs OR cocaina OR droga OR cocaine OR drogue OR \"precursor chemicals\" OR \"hazardous chemicals\" OR \"toxic chemicals\" OR pesticides OR refrigerants OR mercury OR \"ammonium nitrate\" OR \"hazardous waste\" OR \"stolen vehicles\" OR \"protected timber\" OR antiquities OR \"cultural property\" OR \"archaeological artefacts\" OR rosewood OR \"illegal firearms\" OR \"weapons cache\" OR ammunition OR \"arms trafficking\" OR ivory OR \"rhino horn\" OR pangolin OR \"wildlife trafficking\" OR CITES OR hasj OR hennep OR xtc OR kwik OR ivoor OR vuurwapens OR munitie OR cocaïne OR heroïne OR Suchtgift OR Kokain OR kokaín OR narkotika OR kokaiin OR fíkniefni OR hasch OR hasj)"
    # `lang` is the language that site actually publishes in - it decides whether the
    # headline gets auto-translated to English, so it must be the SITE's language, not English,
    # even though the search itself always goes through the English Google News edition.
    sites:
      - {site: cbp.gov,               lang: en}  # US Customs and Border Protection
      - {site: dea.gov,               lang: en}  # US Drug Enforcement Administration
      - {site: justice.gov,           lang: en}  # US Department of Justice / US attorneys
      - {site: ice.gov,                lang: en}  # US Homeland Security Investigations
      - {site: uscg.mil,              lang: en}  # US Coast Guard
      - {site: gov.uk,                lang: en}  # UK National Crime Agency, Border Force, HMRC
      - {site: afp.gov.au,            lang: en}  # Australian Federal Police
      - {site: abf.gov.au,            lang: en}  # Australian Border Force
      - {site: europol.europa.eu,     lang: en}  # Europol
      - {site: unodc.org,             lang: en}  # UN Office on Drugs and Crime
      - {site: wcoomd.org,            lang: en}  # World Customs Organization
      - {site: interpol.int,          lang: en}  # Interpol
      - {site: sars.gov.za,           lang: en}  # South African Revenue Service (customs)
      - {site: saps.gov.za,           lang: en}  # South African Police Service
      - {site: ndlea.gov.ng,          lang: en}  # Nigeria drug law enforcement agency
      - {site: nacoc.gov.gh,          lang: en}  # Ghana Narcotics Control Commission
      - {site: pib.gov.in,            lang: en}  # India government press releases (customs, DRI, NCB)
      - {site: pdea.gov.ph,           lang: en}  # Philippine Drug Enforcement Agency
      - {site: cnb.gov.sg,            lang: en}  # Singapore Central Narcotics Bureau
      - {site: douane.gouv.fr,        lang: fr}  # French customs
      - {site: zoll.de,               lang: de}  # German customs
      - {site: politie.nl,            lang: nl}  # Dutch national police
      - {site: om.nl,                 lang: nl}  # Dutch Public Prosecution Service (Openbaar Ministerie)
      - {site: fiod.nl,               lang: nl}  # Dutch fiscal investigation service (FIOD)
      - {site: kmar.nl,               lang: nl}  # Royal Netherlands Marechaussee (Schiphol, borders)
      - {site: belastingdienst.nl,    lang: nl}  # Dutch Tax and Customs Administration
      - {site: politie.be,            lang: nl}  # Belgian federal police (Dutch-language pages)
      - {site: financien.belgium.be,  lang: nl}  # Belgian customs (FPS Finance)
      - {site: federaalparket.be,     lang: nl}  # Belgian federal prosecutor
      # Austria, Nordic and Baltic countries, Slovakia, Ethiopia, Mongolia (lang = the language of that site)
      - {site: bmi.gv.at,             lang: de}  # Austrian interior ministry (police press releases, Suchtgift)
      - {site: bmf.gv.at,             lang: de}  # Austrian finance ministry (customs)
      - {site: politi.dk,             lang: da}  # Danish police
      - {site: skat.dk,               lang: da}  # Danish tax and customs
      - {site: politsei.ee,           lang: et}  # Estonian police and border guard
      - {site: emta.ee,               lang: et}  # Estonian tax and customs board
      - {site: customs.gov.mn,        lang: mn}  # Mongolian customs
      - {site: tollur.is,             lang: is}  # Icelandic customs
      - {site: logreglan.is,          lang: is}  # Icelandic police
      - {site: toll.no,               lang: "no"}  # Norwegian customs (Tolletaten)
      - {site: politiet.no,           lang: "no"}  # Norwegian police
      - {site: financnasprava.sk,     lang: sk}  # Slovak financial administration (customs)
