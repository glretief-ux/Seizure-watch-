# =====================================================================
#  SEIZURE WATCH - configuration
#  Everything you may want to tune is here. Comments explain each block.
# =====================================================================

run:
  lookback_days: 2            # how far back each daily run searches (2 = safe overlap)
  max_articles_per_run: 1500   # cap on article downloads per run (official sources are read first)
  fetch_full_text: true       # false = headline/snippet only (faster, less accurate)
  resolve_google_links: true  # needs the optional 'googlenewsdecoder' package (in requirements.txt)
  report_days: 180            # how much history the dashboard shows

sources:
  google_news:
    enabled: true
    delay_seconds: 1.0
    # Each edition = one Google News country/language front page. More editions = wider coverage.
    editions:
      - {lang: en, hl: en-US,  gl: US, ceid: "US:en"}
      - {lang: en, hl: en-GB,  gl: GB, ceid: "GB:en"}
      - {lang: en, hl: en-AU,  gl: AU, ceid: "AU:en"}
      - {lang: en, hl: en-IN,  gl: IN, ceid: "IN:en"}
      - {lang: en, hl: en-ZA,  gl: ZA, ceid: "ZA:en"}
      - {lang: en, hl: en-NG,  gl: NG, ceid: "NG:en"}
      - {lang: es, hl: es-419, gl: MX, ceid: "MX:es-419"}
      - {lang: es, hl: es,     gl: ES, ceid: "ES:es"}
      - {lang: es, hl: es-419, gl: CO, ceid: "CO:es-419"}
      - {lang: fr, hl: fr,     gl: FR, ceid: "FR:fr"}
      - {lang: pt, hl: pt-BR,  gl: BR, ceid: "BR:pt-419"}
      - {lang: pt, hl: pt-PT,  gl: PT, ceid: "PT:pt-150"}
      # more languages (Arabic, Turkish, Russian, Chinese, Hindi)
      - {lang: ar, hl: ar,     gl: SA, ceid: "SA:ar"}
      - {lang: ar, hl: ar,     gl: EG, ceid: "EG:ar"}
      - {lang: ar, hl: ar,     gl: AE, ceid: "AE:ar"}
      - {lang: tr, hl: tr,     gl: TR, ceid: "TR:tr"}
      - {lang: ru, hl: ru,     gl: RU, ceid: "RU:ru"}
      - {lang: ru, hl: ru,     gl: UA, ceid: "UA:ru"}
      - {lang: zh, hl: zh-CN,  gl: CN, ceid: "CN:zh-Hans"}
      - {lang: zh, hl: zh-HK,  gl: HK, ceid: "HK:zh-Hant"}
      - {lang: zh, hl: zh-TW,  gl: TW, ceid: "TW:zh-Hant"}
      - {lang: hi, hl: hi,     gl: IN, ceid: "IN:hi"}
      - {lang: vi, hl: vi,     gl: VN, ceid: "VN:vi"}   # Vietnam (ivory searches)
      # Dutch and Flemish: both editions share the "nl" queries below (Antwerp and Rotterdam are the two big
      # European cocaine gateways, so local Dutch-language reporting is often first)
      - {lang: nl, hl: nl,     gl: NL, ceid: "NL:nl"}   # Netherlands (Dutch)
      - {lang: nl, hl: nl,     gl: BE, ceid: "BE:nl"}   # Belgium, Flanders (Flemish)
      # Austria, Nordic and Baltic countries, Slovakia, Ethiopia and Mongolia. Google News may not serve every one of
      # these editions (Iceland and Mongolia in particular); the run log prints "edition XX/lang: N headlines",
      # so a 0 there means that edition returned nothing and GDELT and the official sites are doing the work.
      - {lang: de, hl: de,     gl: AT, ceid: "AT:de"}   # Austria (German)
      - {lang: da, hl: da,     gl: DK, ceid: "DK:da"}   # Denmark (Danish)
      - {lang: et, hl: et,     gl: EE, ceid: "EE:et"}   # Estonia (Estonian)
      - {lang: am, hl: am,     gl: ET, ceid: "ET:am"}   # Ethiopia (Amharic)
      - {lang: is, hl: is,     gl: IS, ceid: "IS:is"}   # Iceland (Icelandic)
      - {lang: mn, hl: mn,     gl: MN, ceid: "MN:mn"}   # Mongolia (Mongolian)
      - {lang: "no", hl: "no",    gl: "NO", ceid: "NO:no"}   # Norway (Norwegian)
      - {lang: sk, hl: sk,     gl: SK, ceid: "SK:sk"}   # Slovakia (Slovak)
